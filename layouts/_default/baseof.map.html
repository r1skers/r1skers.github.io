<!DOCTYPE html>
<html lang="{{ site.Language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} &middot; {{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Summary }}">
  <link rel="stylesheet" href="{{ "assets/la-map/la-map.css" | relURL }}">
  <script defer src="{{ "assets/la-map/la-map-data.js" | relURL }}"></script>
  {{ range sort (readDir "static/assets/la-map/branches") "Name" }}
  <script defer src="{{ printf "assets/la-map/branches/%s" .Name | relURL }}"></script>
  {{ end }}
  <script defer src="{{ "assets/la-map/la-map.js" | relURL }}"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <a class="map-back" href="{{ "/" | relURL }}">&larr; 返回</a>
  {{ block "main" . }}{{ end }}
</body>
</html>
