<!DOCTYPE html>
<html lang="{{ site.Language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Summary }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #020617;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .map-back {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      border: 1px solid #1e293b;
      border-radius: 6px;
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(4px);
      transition: color .15s, border-color .15s;
    }
    .map-back:hover {
      color: #cbd5e1;
      border-color: #334155;
    }
    /* 覆盖嵌入地图的外框，铺满整屏 */
    .la-map-wrap { margin: 0 !important; }
    .la-viewport {
      height: 100vh !important;
      min-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }
    .la-hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0 !important;
    }
    /* 隐藏 markdown 开头的提示 blockquote（已在 .la-hint 里显示了） */
    body > blockquote { display: none !important; }
  </style>
</head>
<body>
  <a class="map-back" href="{{ "/" | relURL }}">← 返回</a>
  {{ block "main" . }}{{ end }}
</body>
</html>
