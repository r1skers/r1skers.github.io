{{- $title := .Get "title" -}}
{{- if not $title -}}
  {{- warnf "missing value for param 'title' in problem-exercise shortcode: %s" .Position -}}
{{- end -}}

<section class="problem-exercise">
  <h3>{{ $title | .Page.RenderString }}</h3>
  <div class="problem-statement">
    {{ .Inner | strings.TrimSpace | .Page.RenderString (dict "display" "block") }}
  </div>
</section>
