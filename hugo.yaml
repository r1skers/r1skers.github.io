theme: ["PaperMod"]
baseURL: "https://r1skers.github.io/"
languageCode: zh-cn
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
title: r1skers' Blog

languages:
  zh:
    languageName: "中文"
    languageCode: "zh-cn"
    weight: 1
    title: "r1skers' Blog"
    params:
      languageAltTitle: "Chinese"
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "r1skers' Blog"
    params:
      languageAltTitle: "English"

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  author:
    name: "r1skers"

  mainSections:
    - posts

  ShowToc: true
  TocOpen: false
  HomeInfoParams:
    Title: "Hephaestus' Forge"
    Subtitle: "Engineering the stairs to apotheosis."
    Content: "An engineering notebook organized around error analysis, reliable computation, and reproducible evidence."
  backgrounds:
    home:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/home"
      webDir: "/img/backgrounds/home"
      position: "center center"
      size: "cover"
    about:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/about"
      webDir: "/img/backgrounds/about"
      position: "center 38%"
      size: "cover"
    notes:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/notes"
      webDir: "/img/backgrounds/notes"
      position: "center 38%"
      size: "cover"
    posts:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/posts"
      webDir: "/img/backgrounds/posts"
      position: "center 38%"
      size: "cover"
    tools:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/tools"
      webDir: "/img/backgrounds/tools"
      position: "center 38%"
      size: "cover"
    artifacts:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/artifacts"
      webDir: "/img/backgrounds/artifacts"
      position: "center 38%"
      size: "cover"
    thinking:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/thinking"
      webDir: "/img/backgrounds/thinking"
      position: "center 38%"
      size: "cover"
    categories:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/categories"
      webDir: "/img/backgrounds/categories"
      position: "center center"
      size: "cover"
    archives:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/archives"
      webDir: "/img/backgrounds/archives"
      position: "center center"
      size: "cover"
    article:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/article"
      webDir: "/img/backgrounds/article"
      position: "center center"
      size: "cover"
  homeRecent:
    enabled: true
    title: "Recent Updates"
    limit: 3
    sections: ["notes", "tools", "posts", "artifacts"]
  homeFocus:
    enabled: true
    title:
      zh: "当前研究"
      en: "Current Research"
    items:
      zh:
        - "[误差分析：从近似到可靠计算](/notes/systems/error-analysis/) — 当前 Topic：Softmax 的 exp、累加、除法与浮点计算路径。"
        - "[主题档案](/notes/topics/) — 跨 Notes、Artifacts 与代码仓库组织完整问题链。"
      en:
        - "[Error Analysis: From Approximation to Reliable Computation](/en/notes/systems/error-analysis/) — Current topic: exp, accumulation, division, and floating-point paths in Softmax."
        - "[Topic Dossiers](/en/notes/topics/) — Complete problem-driven paths across Notes, Artifacts, and code repositories."

  socialIcons:
    - name: GitHub
      url: "https://github.com/"

  cover:
    linkFullImages: true

  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false

  math: true
  mermaid: true

  ShowAllPagesInArchive: true
  displayFullLangName: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10

    - identifier: tags
      name: Tags
      url: /tags/
      weight: 14

    - identifier: series
      name: Series
      url: /series/
      weight: 17

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

  home:
    - identifier: about
      name: About
      url: /about/
      params:
        description: "Who I am and what this blog is about."
      weight: 10

    - identifier: notes
      name: Notes
      url: /notes/
      params:
        description: "Current research threads, topic dossiers, and canonical foundations."
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      params:
        description: "Practical utilities and local workflow tools."
      weight: 30

    - identifier: artifacts
      name: Artifacts
      url: /artifacts/
      params:
        description: "Project build logs, prototypes, and validation notes."
      weight: 35

    - identifier: posts
      name: Posts
      url: /posts/
      params:
        description: "Long-form articles, reflections, and method notes beyond the study notebook."
      weight: 40
