theme: ["PaperMod"]
baseURL: "https://r1skers.github.io/"
languageCode: en-us
title: r1skers' Blog

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  mainSections:
    - posts

  ShowToc: true
  TocOpen: false
  HomeInfoParams:
    Title: "Hephaestus' Forge"
    Subtitle: "Engineering the stairs to apotheosis."
    Content: "An engineering notebook for Notes, Tools, Artifacts, and Thinking. I turn experiments into reproducible records and long-term growth."
  backgrounds:
    home:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/home"
      webDir: "/img/backgrounds/home"
      position: "center center"
      size: "cover"
    about:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/about"
      webDir: "/img/backgrounds/about"
      position: "center top"
      size: "cover"
  homeRecent:
    enabled: true
    title: "Recent Updates"
    limit: 3
    sections: ["notes", "tools", "posts", "artifacts"]

  socialIcons:
    - name: GitHub
      url: "https://github.com/"

  cover:
    linkFullImages: true

  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false

  math: true
  mermaid: true

  ShowAllPagesInArchive: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

  home:
    - identifier: about
      name: About
      url: /about/
      params:
        description: "Who I am and what this blog is about."
      weight: 10

    - identifier: notes
      name: Notes
      url: /notes/
      params:
        description: "Study notes, field logs, and technical drafts."
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      params:
        description: "Practical utilities and local workflow tools."
      weight: 30

    - identifier: artifacts
      name: Artifacts
      url: /artifacts/
      params:
        description: "Project build logs, prototypes, and validation notes."
      weight: 35

    - identifier: thinking
      name: Thinking
      url: /thinking/
      params:
        description: "Eureka, life reflections, and philosophy in one place."
      weight: 40
