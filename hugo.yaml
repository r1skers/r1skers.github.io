theme: ["PaperMod"]
baseURL: "https://r1skers.github.io/"
languageCode: en-us
title: r1skers' Blog

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  mainSections:
    - posts

  ShowToc: true
  TocOpen: false
  HomeInfoParams:
    Title: "Hephaestus' Forge"
    Subtitle: "Engineering the stairs to apotheosis."
    Content: "Welcome to the forge. I'm r1skers, an Electrical Engineering student navigating the worlds of hardware, software, and epic narratives."

  socialIcons:
    - name: GitHub
      url: "https://github.com/"

  cover:
    linkFullImages: true

  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false

  math: true
  mermaid: true

  ShowAllPagesInArchive: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

  home:
    - identifier: about
      name: About
      url: /about/
      params:
        description: "Who I am and what this blog is about."
      weight: 10

    - identifier: notes
      name: Notes
      url: /notes/
      params:
        description: "Study notes, field logs, and technical drafts."
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      params:
        description: "Practical utilities and local workflow tools."
      weight: 30

    - identifier: eureka
      name: Eureka
      url: /series/eureka/
      params:
        description: "Breakthrough ideas and cross-domain deep dives."
      weight: 40
