theme: ["PaperMod"]
baseURL: "https://r1skers.github.io/"
languageCode: zh-cn
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
title: r1skers' Blog

languages:
  zh:
    languageName: "中文"
    languageCode: "zh-cn"
    weight: 1
    title: "r1skers' Blog"
    params:
      languageAltTitle: "Chinese"
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "r1skers' Blog"
    params:
      languageAltTitle: "English"

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']
    renderer:
      unsafe: true

params:
  author:
    name: "r1skers"

  mainSections:
    - posts

  ShowToc: true
  TocOpen: false
  HomeInfoParams:
    Title: "Hephaestus' Forge"
    Subtitle: "Engineering the stairs to apotheosis."
    Content: "An engineering notebook for Notes, Posts, Tools, and Artifacts. I turn experiments into reproducible records and long-term growth."
  backgrounds:
    home:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/home"
      webDir: "/img/backgrounds/home"
      position: "center center"
      size: "cover"
    about:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/about"
      webDir: "/img/backgrounds/about"
      position: "center 38%"
      size: "cover"
    notes:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/notes"
      webDir: "/img/backgrounds/notes"
      position: "center 38%"
      size: "cover"
    posts:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/posts"
      webDir: "/img/backgrounds/posts"
      position: "center 38%"
      size: "cover"
    tools:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/tools"
      webDir: "/img/backgrounds/tools"
      position: "center 38%"
      size: "cover"
    artifacts:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/artifacts"
      webDir: "/img/backgrounds/artifacts"
      position: "center 38%"
      size: "cover"
    thinking:
      enabled: true
      scope: "page"
      image: "/img/backgrounds/shared/akali_splash_uncentered_61_enhanced.jpg"
      dir: "static/img/backgrounds/thinking"
      webDir: "/img/backgrounds/thinking"
      position: "center 38%"
      size: "cover"
    categories:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/categories"
      webDir: "/img/backgrounds/categories"
      position: "center center"
      size: "cover"
    archives:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/archives"
      webDir: "/img/backgrounds/archives"
      position: "center center"
      size: "cover"
    article:
      enabled: true
      scope: "page"
      image: ""
      dir: "static/img/backgrounds/article"
      webDir: "/img/backgrounds/article"
      position: "center center"
      size: "cover"
  homeRecent:
    enabled: true
    title: "Recent Updates"
    limit: 3
    sections: ["notes", "tools", "posts", "artifacts"]
  homeFocus:
    enabled: true
    title:
      zh: "准备研究的问题"
      en: "Research Questions"
    items:
      zh:
        - "Transformer 序列是否可以用收敛视角理解：BERT token 表示在层间是否呈现逐渐增强的聚类稳定性？"
        - "Streaming k-means：边做 assignment，边累计每个簇的 sum/count，避免存储大规模中间矩阵。"
        - "反演中的能量解释：除了 σ 太小导致分母敏感之外，寻找更好的直觉和表述。"
      en:
        - "Can Transformer sequences be understood through convergence: do BERT token representations show increasingly stable clusters across layers?"
        - "Streaming k-means: accumulate each cluster's sum/count during assignment to avoid storing large intermediate matrices."
        - "Energy interpretation in inversion: find a clearer explanation beyond small σ making the denominator sensitive."

  socialIcons:
    - name: GitHub
      url: "https://github.com/"

  cover:
    linkFullImages: true

  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: false

  math: true
  mermaid: true

  ShowAllPagesInArchive: true
  displayFullLangName: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

  home:
    - identifier: about
      name: About
      url: /about/
      params:
        description: "Who I am and what this blog is about."
      weight: 10

    - identifier: notes
      name: Notes
      url: /notes/
      params:
        description: "Study notes, field logs, and technical drafts."
      weight: 20

    - identifier: tools
      name: Tools
      url: /tools/
      params:
        description: "Practical utilities and local workflow tools."
      weight: 30

    - identifier: artifacts
      name: Artifacts
      url: /artifacts/
      params:
        description: "Project build logs, prototypes, and validation notes."
      weight: 35

    - identifier: posts
      name: Posts
      url: /posts/
      params:
        description: "Long-form articles, reflections, and method notes beyond the study notebook."
      weight: 40
