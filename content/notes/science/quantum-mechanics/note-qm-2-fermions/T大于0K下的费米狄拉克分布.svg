<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 20px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .label { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .axis { stroke: #0f172a; stroke-width: 2.4; }
      .guide { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; }
      .curve { fill: none; stroke: #111827; stroke-width: 4; }
      .step0 { fill: none; stroke: #94a3b8; stroke-width: 2.4; stroke-dasharray: 7 6; }
      .window { fill: #fde68a; opacity: 0.45; }
      .ef { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 7 6; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="46" text-anchor="middle" class="title">Fermi-Dirac at T &gt; 0 K</text>
  <text x="490" y="74" text-anchor="middle" class="small">热展宽: 阶跃在 E_F 附近被抹平, 宽度约几倍 k_B T</text>

  <rect x="90" y="110" width="610" height="400" class="box"/>
  <line x1="150" y1="460" x2="660" y2="460" class="axis"/>
  <line x1="150" y1="460" x2="150" y2="150" class="axis"/>
  <text x="668" y="467" class="label">E</text>
  <text x="132" y="154" class="label">f(E)</text>

  <!-- thermal window around EF -->
  <rect x="335" y="150" width="120" height="310" class="window"/>
  <text x="345" y="168" class="small">~ a few k_B T</text>

  <!-- T=0 step (reference) -->
  <path class="step0" d="M150 180 H390 V460 H660"/>

  <!-- finite-T sigmoid -->
  <path class="curve" d="M150 185 C250 185, 305 190, 350 235 C375 260, 385 300, 390 320 C398 355, 418 395, 460 430 C505 455, 570 460, 660 460"/>

  <!-- EF -->
  <line x1="390" y1="150" x2="390" y2="460" class="ef"/>
  <text x="398" y="173" class="label" fill="#ef4444">E_F</text>
  <line x1="150" y1="320" x2="660" y2="320" class="guide"/>
  <text x="118" y="326" class="small">1/2</text>

  <!-- ticks -->
  <line x1="145" y1="180" x2="155" y2="180" class="guide"/>
  <line x1="145" y1="460" x2="155" y2="460" class="guide"/>
  <text x="126" y="186" class="small">1</text>
  <text x="126" y="466" class="small">0</text>

  <!-- notes -->
  <rect x="730" y="130" width="220" height="360" class="box"/>
  <text x="752" y="165" class="subtitle">Interpretation</text>
  <text x="752" y="200" class="small">f(E_F) = 1/2</text>
  <text x="752" y="224" class="small">Below E_F: mostly occupied</text>
  <text x="752" y="248" class="small">Above E_F: partial occupation</text>
  <text x="752" y="286" class="small">T 越高, 过渡越平缓</text>
  <text x="752" y="310" class="small">Higher T = stronger smearing</text>
</svg>
