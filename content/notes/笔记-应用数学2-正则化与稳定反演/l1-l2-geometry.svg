<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #fafafa; stroke: #dddddd; stroke-width: 1.5; }
      .axis { stroke: #8a8a8a; stroke-width: 1.2; }
      .ellipse { fill: none; stroke: #6b7280; stroke-width: 1.5; opacity: 0.9; }
      .l2 { fill: none; stroke: #2563eb; stroke-width: 2.5; }
      .l1 { fill: none; stroke: #dc2626; stroke-width: 2.5; }
      .dot { fill: #111827; }
      .label { font: 16px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #374151; }
      .title { font: 18px sans-serif; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="460" />

  <rect class="panel" x="25" y="25" width="450" height="410" rx="12" />
  <rect class="panel" x="505" y="25" width="450" height="410" rx="12" />

  <!-- Left panel: L2 -->
  <text class="title" x="190" y="58">L2 (Ridge): circle constraint</text>
  <line class="axis" x1="250" y1="100" x2="250" y2="380" />
  <line class="axis" x1="90" y1="240" x2="410" y2="240" />
  <text class="small" x="414" y="245">w1</text>
  <text class="small" x="254" y="95">w2</text>

  <ellipse class="ellipse" cx="260" cy="230" rx="145" ry="95" transform="rotate(-25 260 230)" />
  <ellipse class="ellipse" cx="260" cy="230" rx="110" ry="72" transform="rotate(-25 260 230)" />
  <ellipse class="ellipse" cx="260" cy="230" rx="76" ry="50" transform="rotate(-25 260 230)" />

  <circle class="l2" cx="250" cy="240" r="105" />
  <circle class="dot" cx="327" cy="169" r="5" />
  <text class="small" x="336" y="166">optimum</text>
  <text class="small" x="95" y="407">Most coefficients shrink together, usually not exactly zero.</text>

  <!-- Right panel: L1 -->
  <text class="title" x="665" y="58">L1 (Lasso): diamond constraint</text>
  <line class="axis" x1="730" y1="100" x2="730" y2="380" />
  <line class="axis" x1="570" y1="240" x2="890" y2="240" />
  <text class="small" x="894" y="245">w1</text>
  <text class="small" x="734" y="95">w2</text>

  <ellipse class="ellipse" cx="740" cy="230" rx="145" ry="95" transform="rotate(-25 740 230)" />
  <ellipse class="ellipse" cx="740" cy="230" rx="110" ry="72" transform="rotate(-25 740 230)" />
  <ellipse class="ellipse" cx="740" cy="230" rx="76" ry="50" transform="rotate(-25 740 230)" />

  <polygon class="l1" points="730,130 840,240 730,350 620,240" />
  <circle class="dot" cx="730" cy="130" r="5" />
  <text class="small" x="744" y="126">optimum on a corner</text>
  <text class="small" x="575" y="407">Corners encourage sparsity: some coefficients become exactly zero.</text>
</svg>
