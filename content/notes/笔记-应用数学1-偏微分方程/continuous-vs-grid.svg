<svg viewBox="0 0 980 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rough slope in reality vs smooth slope seen by coarse numerical grid">
<defs>
<linearGradient id="leftArea" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#62a7ff" stop-opacity="0.30"/>
<stop offset="100%" stop-color="#67e2b7" stop-opacity="0.18"/>
</linearGradient>
<linearGradient id="rightArea" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#f6a37b" stop-opacity="0.30"/>
<stop offset="100%" stop-color="#f8d78f" stop-opacity="0.18"/>
</linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 Z" fill="rgba(55,55,55,0.55)"/>
</marker>
</defs>

<rect x="1" y="1" width="978" height="358" rx="14" ry="14" fill="rgba(255,255,255,0.30)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
<line x1="490" y1="22" x2="490" y2="338" stroke="rgba(60,60,60,0.28)" stroke-width="1.4"/>

<text x="36" y="46" font-size="22" font-weight="700" fill="rgba(35,35,35,0.92)">Reality: rough slope</text>
<text x="36" y="72" font-size="15" fill="rgba(35,35,35,0.82)">Large-scale incline + micro bumps/pits</text>

<line x1="36" y1="264" x2="462" y2="170" stroke="rgba(31,111,235,0.30)" stroke-width="2.6" stroke-dasharray="8 6"/>
<text x="40" y="286" font-size="13" fill="rgba(35,35,35,0.76)">overall slope trend</text>

<path d="M36 270 L62 264 L88 257 L110 250 L132 244 L154 238 L176 232 L198 227 L218 220 L236 214 L256 211 L274 205 L294 208 L312 199 L330 195 L350 187 L368 192 L386 181 L404 184 L424 173 L444 176 L462 169 L462 320 L36 320 Z" fill="url(#leftArea)"/>
<path d="M36 270 L62 264 L88 257 L110 250 L132 244 L154 238 L176 232 L198 227 L218 220 L236 214 L256 211 L274 205 L294 208 L312 199 L330 195 L350 187 L368 192 L386 181 L404 184 L424 173 L444 176 L462 169" fill="none" stroke="#1f6feb" stroke-width="4"/>

<circle cx="110" cy="250" r="4.8" fill="#1f6feb"/>
<circle cx="198" cy="227" r="4.8" fill="#1f6feb"/>
<circle cx="274" cy="205" r="4.8" fill="#1f6feb"/>
<circle cx="350" cy="187" r="4.8" fill="#1f6feb"/>
<circle cx="424" cy="173" r="4.8" fill="#1f6feb"/>
<text x="208" y="240" font-size="12" fill="rgba(35,35,35,0.80)">micro roughness</text>

<line x1="454" y1="122" x2="526" y2="122" stroke="rgba(55,55,55,0.55)" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="456" y="114" font-size="12" fill="rgba(35,35,35,0.78)">coarse sampling</text>

<text x="526" y="46" font-size="22" font-weight="700" fill="rgba(35,35,35,0.92)">Computer: smooth slope</text>
<text x="526" y="72" font-size="15" fill="rgba(35,35,35,0.82)">Sub-grid bumps are averaged out</text>

<path d="M528 272 L944 182 L944 320 L528 320 Z" fill="url(#rightArea)"/>
<line x1="528" y1="272" x2="944" y2="182" stroke="#cf5c2b" stroke-width="4"/>
<line x1="528" y1="272" x2="944" y2="182" stroke="rgba(206,92,43,0.42)" stroke-width="1.2" stroke-dasharray="5 5"/>

<circle cx="592" cy="258" r="5.5" fill="#cf5c2b"/>
<circle cx="672" cy="241" r="5.5" fill="#cf5c2b"/>
<circle cx="752" cy="224" r="5.5" fill="#cf5c2b"/>
<circle cx="832" cy="207" r="5.5" fill="#cf5c2b"/>
<circle cx="912" cy="190" r="5.5" fill="#cf5c2b"/>
<text x="536" y="294" font-size="13" fill="rgba(35,35,35,0.78)">retained low-frequency slope</text>

<rect x="710" y="232" width="184" height="92" rx="8" ry="8" fill="rgba(255,255,255,0.50)" stroke="rgba(55,55,55,0.42)" stroke-width="1.1"/>
<text x="720" y="248" font-size="12" fill="rgba(35,35,35,0.84)">five-point stencil (local)</text>
<line x1="802" y1="254" x2="802" y2="307" stroke="rgba(55,55,55,0.30)" stroke-width="1"/>
<line x1="748" y1="281" x2="855" y2="281" stroke="rgba(55,55,55,0.30)" stroke-width="1"/>
<circle cx="802" cy="281" r="7" fill="#ce5c2a"/>
<circle cx="802" cy="260" r="5" fill="rgba(31,111,235,0.85)"/>
<circle cx="802" cy="302" r="5" fill="rgba(31,111,235,0.85)"/>
<circle cx="770" cy="281" r="5" fill="rgba(31,111,235,0.85)"/>
<circle cx="834" cy="281" r="5" fill="rgba(31,111,235,0.85)"/>
<text x="720" y="317" font-size="11.5" fill="rgba(35,35,35,0.80)">center and 4 neighbors sample only local averages</text>
</svg>
