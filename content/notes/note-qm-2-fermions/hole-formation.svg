<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .label { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .bandTop { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; }
      .bandBot { fill: #fef9c3; stroke: #fde68a; stroke-width: 2; }
      .gap { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 8 6; }
      .electron { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
      .excited { fill: #ef4444; stroke: #b91c1c; stroke-width: 2; }
      .hole { fill: #ffffff; stroke: #f59e0b; stroke-width: 3; }
      .arrow { stroke: #dc2626; stroke-width: 3; marker-end: url(#arrowHead); }
      .divider { stroke: #cbd5e1; stroke-width: 2; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Hole Formation in a Semiconductor</text>
  <text x="600" y="78" text-anchor="middle" class="small">Valence-band vacancy behaves as an effective positive carrier</text>

  <line x1="600" y1="100" x2="600" y2="520" class="divider"/>

  <!-- Left panel -->
  <text x="300" y="122" text-anchor="middle" class="subtitle">Before Excitation</text>
  <rect x="90" y="150" width="420" height="120" class="bandTop"/>
  <text x="300" y="220" text-anchor="middle" class="label">Conduction Band (mostly empty)</text>
  <rect x="90" y="270" width="420" height="60" class="gap"/>
  <text x="300" y="307" text-anchor="middle" class="small">Band Gap</text>
  <rect x="90" y="330" width="420" height="140" class="bandBot"/>
  <text x="300" y="405" text-anchor="middle" class="label">Valence Band (mostly filled)</text>

  <!-- electrons in left valence band -->
  <circle cx="145" cy="360" r="12" class="electron"/>
  <circle cx="195" cy="360" r="12" class="electron"/>
  <circle cx="245" cy="360" r="12" class="electron"/>
  <circle cx="295" cy="360" r="12" class="electron"/>
  <circle cx="345" cy="360" r="12" class="electron"/>
  <circle cx="395" cy="360" r="12" class="electron"/>
  <circle cx="445" cy="360" r="12" class="electron"/>
  <circle cx="145" cy="420" r="12" class="electron"/>
  <circle cx="195" cy="420" r="12" class="electron"/>
  <circle cx="245" cy="420" r="12" class="electron"/>
  <circle cx="295" cy="420" r="12" class="electron"/>
  <circle cx="345" cy="420" r="12" class="electron"/>
  <circle cx="395" cy="420" r="12" class="electron"/>
  <circle cx="445" cy="420" r="12" class="electron"/>

  <!-- Right panel -->
  <text x="900" y="122" text-anchor="middle" class="subtitle">After Excitation</text>
  <rect x="690" y="150" width="420" height="120" class="bandTop"/>
  <text x="900" y="220" text-anchor="middle" class="label">Conduction Band</text>
  <rect x="690" y="270" width="420" height="60" class="gap"/>
  <text x="900" y="307" text-anchor="middle" class="small">Band Gap</text>
  <rect x="690" y="330" width="420" height="140" class="bandBot"/>
  <text x="900" y="405" text-anchor="middle" class="label">Valence Band</text>

  <!-- electrons in right valence band with one missing -->
  <circle cx="745" cy="360" r="12" class="electron"/>
  <circle cx="795" cy="360" r="12" class="electron"/>
  <circle cx="845" cy="360" r="12" class="electron"/>
  <!-- hole position -->
  <circle cx="895" cy="360" r="14" class="hole"/>
  <text x="895" y="366" text-anchor="middle" class="label">+</text>
  <circle cx="945" cy="360" r="12" class="electron"/>
  <circle cx="995" cy="360" r="12" class="electron"/>
  <circle cx="1045" cy="360" r="12" class="electron"/>
  <circle cx="745" cy="420" r="12" class="electron"/>
  <circle cx="795" cy="420" r="12" class="electron"/>
  <circle cx="845" cy="420" r="12" class="electron"/>
  <circle cx="895" cy="420" r="12" class="electron"/>
  <circle cx="945" cy="420" r="12" class="electron"/>
  <circle cx="995" cy="420" r="12" class="electron"/>
  <circle cx="1045" cy="420" r="12" class="electron"/>

  <!-- excited electron -->
  <circle cx="895" cy="185" r="12" class="excited"/>
  <text x="958" y="190" class="small">Excited electron</text>
  <text x="958" y="368" class="small">Hole (+)</text>

  <!-- excitation arrow -->
  <line x1="895" y1="340" x2="895" y2="205" class="arrow"/>
  <text x="915" y="268" class="small">thermal / optical excitation</text>
</svg>
