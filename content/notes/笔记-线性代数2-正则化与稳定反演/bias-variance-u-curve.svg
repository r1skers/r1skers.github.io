<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .axis { stroke: #6b7280; stroke-width: 2; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .bias { fill: none; stroke: #2563eb; stroke-width: 3; }
      .var { fill: none; stroke: #dc2626; stroke-width: 3; }
      .test { fill: none; stroke: #111827; stroke-width: 4; }
      .opt { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 7 6; }
      .label { font: 16px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #374151; }
      .title { font: 20px sans-serif; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="420"/>
  <text class="title" x="275" y="36">Bias-Variance Tradeoff (Classic U-Curve)</text>

  <rect x="90" y="70" width="740" height="280" fill="#fafafa" stroke="#e5e7eb"/>

  <line class="grid" x1="90" y1="126" x2="830" y2="126"/>
  <line class="grid" x1="90" y1="182" x2="830" y2="182"/>
  <line class="grid" x1="90" y1="238" x2="830" y2="238"/>
  <line class="grid" x1="90" y1="294" x2="830" y2="294"/>

  <line class="axis" x1="90" y1="350" x2="830" y2="350"/>
  <line class="axis" x1="90" y1="350" x2="90" y2="70"/>

  <path class="bias" d="M100,95 C260,130 430,200 820,330"/>
  <path class="var" d="M100,330 C320,220 560,130 820,95"/>
  <path class="test" d="M100,255 C250,210 360,188 465,182 C560,186 655,210 820,255"/>

  <line class="opt" x1="470" y1="350" x2="470" y2="150"/>
  <circle cx="470" cy="182" r="5" fill="#10b981"/>

  <text class="label" x="460" y="392" text-anchor="middle">Model Complexity</text>
  <text class="label" x="20" y="68" transform="rotate(-90 20,68)">Error</text>

  <text class="small" x="150" y="112" fill="#2563eb">Bias^2</text>
  <text class="small" x="760" y="112" fill="#dc2626">Variance</text>
  <text class="small" x="505" y="176">Test Error</text>
  <text class="small" x="484" y="342">Best tradeoff</text>

  <text class="small" x="104" y="372">Underfit</text>
  <text class="small" x="760" y="372">Overfit</text>
</svg>
