<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .axis { stroke: #6b7280; stroke-width: 2; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .test { fill: none; stroke: #111827; stroke-width: 4; }
      .bias { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .var { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .thr { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 7 6; }
      .label { font: 16px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #374151; }
      .title { font: 20px sans-serif; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="420"/>
  <text class="title" x="300" y="36">Double Descent (Test Error)</text>

  <rect x="90" y="70" width="740" height="280" fill="#fafafa" stroke="#e5e7eb"/>

  <line class="grid" x1="90" y1="126" x2="830" y2="126"/>
  <line class="grid" x1="90" y1="182" x2="830" y2="182"/>
  <line class="grid" x1="90" y1="238" x2="830" y2="238"/>
  <line class="grid" x1="90" y1="294" x2="830" y2="294"/>

  <line class="axis" x1="90" y1="350" x2="830" y2="350"/>
  <line class="axis" x1="90" y1="350" x2="90" y2="70"/>

  <!-- Auxiliary components -->
  <path class="bias" d="M100,170 C220,190 360,215 520,240 C620,255 720,268 820,276"/>
  <path class="var" d="M100,300 C220,275 340,250 460,220 C500,210 520,110 540,210 C620,248 710,270 820,282"/>

  <!-- Double-descent style curve: valley -> peak -> valley -->
  <path class="test" d="M100,255 C180,285 260,305 340,300 C410,295 470,210 520,130 C590,170 680,260 790,280 C805,282 815,281 820,279"/>

  <!-- Interpolation threshold -->
  <line class="thr" x1="520" y1="350" x2="520" y2="92"/>
  <text class="small" x="532" y="98" fill="#b45309">Interpolation threshold</text>

  <circle cx="340" cy="300" r="4.5" fill="#111827"/>
  <circle cx="520" cy="130" r="4.5" fill="#111827"/>
  <circle cx="790" cy="280" r="4.5" fill="#111827"/>

  <text class="small" x="248" y="320">First descent</text>
  <text class="small" x="458" y="122">Interpolation peak</text>
  <text class="small" x="694" y="298">Second descent</text>

  <!-- Legend -->
  <rect x="610" y="84" width="205" height="98" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="625" y1="108" x2="665" y2="108" class="test"/>
  <text class="small" x="674" y="112">Test Error</text>
  <line x1="625" y1="132" x2="665" y2="132" class="bias"/>
  <text class="small" x="674" y="136" fill="#2563eb">Bias (aux)</text>
  <line x1="625" y1="156" x2="665" y2="156" class="var"/>
  <text class="small" x="674" y="160" fill="#dc2626">Variance (aux)</text>

  <text class="label" x="460" y="392" text-anchor="middle">Model Complexity</text>
  <text class="label" x="24" y="220" transform="rotate(-90 24,220)">Test Error (lower is better)</text>

  <text class="small" x="104" y="372">Under-parameterized</text>
  <text class="small" x="680" y="372">Over-parameterized</text>
</svg>
