<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="title desc">
  <title id="title">两板接地、板间有均匀空间电荷的平行板及其电势</title>
  <desc id="desc">上半部分是相距 1 毫米的两块接地导体板，板间介质里有均匀分布的正空间电荷，颜色越深表示电势越高；电场从中点分别指向两板，中点处电场为零，两板内表面各感应出 −4 μC/m² 的负面电荷。下半部分是与之对齐的电势曲线：两板处为 0 V，中点最高 10 V，是一条抛物线，两端斜率不为零。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde7df"/>
    </linearGradient>
    <!-- Colour follows the potential phi(x) = 10 V * 4t(1-t), t = x/L; one-hue ramp interpolated in OKLab. -->
    <linearGradient id="pot" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="550" y2="0">
      <stop offset="0.0" stop-color="#fbe4cf"/>
      <stop offset="0.1" stop-color="#f4af91"/>
      <stop offset="0.2" stop-color="#ea8561"/>
      <stop offset="0.3" stop-color="#e1653b"/>
      <stop offset="0.4" stop-color="#db501e"/>
      <stop offset="0.5" stop-color="#d9480f"/>
      <stop offset="0.6" stop-color="#db501e"/>
      <stop offset="0.7" stop-color="#e1653b"/>
      <stop offset="0.8" stop-color="#ea8561"/>
      <stop offset="0.9" stop-color="#f4af91"/>
      <stop offset="1.0" stop-color="#fbe4cf"/>
    </linearGradient>
    <pattern id="plate" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
      <rect width="6" height="6" fill="#ebe2db"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8f7a6f" stroke-width="1.4"/>
    </pattern>
    <pattern id="charge" patternUnits="userSpaceOnUse" x="178" y="132" width="26" height="36">
      <g stroke="#7c2d12" stroke-width="1.1" fill="none" opacity="0.75">
        <circle cx="7" cy="10" r="3.4"/>
        <line x1="4.2" y1="10" x2="9.8" y2="10"/>
        <line x1="7" y1="7.2" x2="7" y2="12.8"/>
        <circle cx="20" cy="26" r="3.4"/>
        <line x1="17.2" y1="26" x2="22.8" y2="26"/>
        <line x1="20" y1="23.2" x2="20" y2="28.8"/>
      </g>
    </pattern>
    <style>
      text {
        font-family: Inter, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        fill: #211814;
      }
      .title { font-size: 21px; font-weight: 700; }
      .sub { font-size: 14px; fill: #6f5a50; }
      .panel { font-size: 14px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 13px; fill: #6f5a50; }
      .halo { paint-order: stroke; stroke: #fff7ed; stroke-width: 4px; stroke-linejoin: round; }
      .axis { stroke: #6f5a50; stroke-width: 1.4; }
      .guide { stroke: #cdb8ab; stroke-width: 1; stroke-dasharray: 3 4; }
      .ref { stroke: #b9a397; stroke-width: 1; stroke-dasharray: 4 4; }
      .tangent { stroke: #6f5a50; stroke-width: 1.2; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="10" y="10" width="700" height="432" rx="20" fill="url(#bg)" stroke="#f1d6c7"/>
  <text x="36" y="48" class="title">两板接地、板间有均匀空间电荷</text>
  <text x="36" y="74" class="sub">L = 1 mm，ε<tspan baseline-shift="sub" font-size="10">d</tspan> = 1.0×10⁻¹⁰ F/m，ρ = 8 mC/m³；板面很大，忽略边缘效应</text>

  <!-- Plates and the charged dielectric between them -->
  <text x="153" y="98" class="label" text-anchor="middle">接地 0 V</text>
  <text x="567" y="98" class="label" text-anchor="middle">接地 0 V</text>
  <text x="360" y="120" class="small" text-anchor="middle">中点 E = 0</text>

  <rect x="170" y="128" width="380" height="44" fill="url(#pot)" stroke="#6f5a50" stroke-width="1.2"/>
  <rect x="178" y="132" width="364" height="36" fill="url(#charge)"/>
  <line x1="360" y1="124" x2="360" y2="176" class="ref"/>
  <rect x="136" y="104" width="34" height="92" rx="3" fill="url(#plate)" stroke="#6f5a50" stroke-width="1.2"/>
  <rect x="550" y="104" width="34" height="92" rx="3" fill="url(#plate)" stroke="#6f5a50" stroke-width="1.2"/>

  <!-- Induced negative surface charge on the inner faces -->
  <g stroke="#1d4ed8" stroke-width="1.2" fill="#eef2ff">
    <circle cx="162" cy="124" r="4.2"/><circle cx="162" cy="142" r="4.2"/>
    <circle cx="162" cy="160" r="4.2"/><circle cx="162" cy="178" r="4.2"/>
    <circle cx="558" cy="124" r="4.2"/><circle cx="558" cy="142" r="4.2"/>
    <circle cx="558" cy="160" r="4.2"/><circle cx="558" cy="178" r="4.2"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="1.2">
    <line x1="159.4" y1="124" x2="164.6" y2="124"/><line x1="159.4" y1="142" x2="164.6" y2="142"/>
    <line x1="159.4" y1="160" x2="164.6" y2="160"/><line x1="159.4" y1="178" x2="164.6" y2="178"/>
    <line x1="555.4" y1="124" x2="560.6" y2="124"/><line x1="555.4" y1="142" x2="560.6" y2="142"/>
    <line x1="555.4" y1="160" x2="560.6" y2="160"/><line x1="555.4" y1="178" x2="560.6" y2="178"/>
  </g>
  <text x="88" y="144" class="small" text-anchor="middle">感应面电荷</text>
  <text x="88" y="161" class="small" text-anchor="middle">−4 μC/m²</text>
  <text x="632" y="144" class="small" text-anchor="middle">感应面电荷</text>
  <text x="632" y="161" class="small" text-anchor="middle">−4 μC/m²</text>

  <!-- Electric field, pointing from the middle towards each plate -->
  <line x1="345" y1="150" x2="196" y2="150" stroke="#fff7ed" stroke-width="7"/>
  <line x1="345" y1="150" x2="196" y2="150" stroke="#9a3412" stroke-width="3"/>
  <polygon points="186,150 200,143 200,157" fill="#9a3412" stroke="#fff7ed" stroke-width="1.5"/>
  <line x1="375" y1="150" x2="524" y2="150" stroke="#fff7ed" stroke-width="7"/>
  <line x1="375" y1="150" x2="524" y2="150" stroke="#9a3412" stroke-width="3"/>
  <polygon points="534,150 520,143 520,157" fill="#9a3412" stroke="#fff7ed" stroke-width="1.5"/>
  <text x="268" y="144" class="small halo" text-anchor="middle">E</text>
  <text x="452" y="144" class="small halo" text-anchor="middle">E</text>
  <text x="360" y="212" class="small" text-anchor="middle">介质中均匀空间电荷；颜色越深，电势越高</text>

  <line x1="170" y1="200" x2="170" y2="252" class="guide"/>
  <line x1="550" y1="200" x2="550" y2="398" class="guide"/>

  <!-- Potential profile, aligned with the gap: x = 0 at 170 px, x = L at 550 px; 12 px per volt -->
  <text x="36" y="250" class="panel">电势 φ(x)</text>
  <path d="M170,400 Q360,160 550,400 Z" fill="url(#pot)" fill-opacity="0.35"/>
  <line x1="170" y1="280" x2="360" y2="280" class="ref"/>
  <line x1="170" y1="400" x2="242" y2="309" class="tangent"/>
  <line x1="550" y1="400" x2="478" y2="309" class="tangent"/>
  <path d="M170,400 Q360,160 550,400" fill="none" stroke="#c2410c" stroke-width="2.5"/>

  <line x1="170" y1="400" x2="588" y2="400" class="axis"/>
  <polygon points="598,400 586,395 586,405" fill="#6f5a50"/>
  <line x1="170" y1="400" x2="170" y2="266" class="axis"/>
  <polygon points="170,254 165,266 175,266" fill="#6f5a50"/>
  <line x1="360" y1="400" x2="360" y2="405" class="axis"/>
  <line x1="550" y1="400" x2="550" y2="405" class="axis"/>
  <line x1="165" y1="280" x2="170" y2="280" class="axis"/>
  <text x="170" y="422" class="small" text-anchor="middle">0</text>
  <text x="360" y="422" class="small" text-anchor="middle">L/2</text>
  <text x="550" y="422" class="small" text-anchor="middle">L</text>
  <text x="606" y="405" class="label">x</text>
  <text x="180" y="262" class="label">φ</text>
  <text x="160" y="285" class="small" text-anchor="end">10 V</text>
  <text x="160" y="405" class="small" text-anchor="end">0 V</text>

  <circle cx="170" cy="400" r="4" fill="#c2410c" stroke="#fff7ed" stroke-width="2"/>
  <circle cx="550" cy="400" r="4" fill="#c2410c" stroke="#fff7ed" stroke-width="2"/>
  <circle cx="360" cy="280" r="4" fill="#c2410c" stroke="#fff7ed" stroke-width="2"/>
  <text x="360" y="271" class="label halo" text-anchor="middle">中点 10 V</text>
  <text x="562" y="358" class="small">两端斜率不为零：</text>
  <text x="562" y="376" class="small">板上有感应电荷</text>
</svg>
