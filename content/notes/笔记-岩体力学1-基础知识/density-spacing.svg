<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f7f7f7"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#222">Discontinuity Density vs Spacing</text>

  <!-- upper: low density / large spacing -->
  <text x="80" y="115" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#198754">Case A: low density, large spacing</text>
  <line x1="80" y1="160" x2="880" y2="160" stroke="#333" stroke-width="3"/>
  <line x1="170" y1="130" x2="170" y2="190" stroke="#0d6efd" stroke-width="4"/>
  <line x1="390" y1="130" x2="390" y2="190" stroke="#0d6efd" stroke-width="4"/>
  <line x1="650" y1="130" x2="650" y2="190" stroke="#0d6efd" stroke-width="4"/>
  <line x1="170" y1="220" x2="390" y2="220" stroke="#ff8c00" stroke-width="3"/>
  <polygon points="170,220 180,214 180,226" fill="#ff8c00"/>
  <polygon points="390,220 380,214 380,226" fill="#ff8c00"/>
  <text x="240" y="247" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ff8c00">spacing</text>

  <!-- lower: high density / small spacing -->
  <text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#dc3545">Case B: high density, small spacing</text>
  <line x1="80" y1="375" x2="880" y2="375" stroke="#333" stroke-width="3"/>
  <line x1="140" y1="345" x2="140" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="230" y1="345" x2="230" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="320" y1="345" x2="320" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="410" y1="345" x2="410" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="500" y1="345" x2="500" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="590" y1="345" x2="590" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="680" y1="345" x2="680" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="770" y1="345" x2="770" y2="405" stroke="#0d6efd" stroke-width="4"/>
  <line x1="230" y1="435" x2="320" y2="435" stroke="#ff8c00" stroke-width="3"/>
  <polygon points="230,435 240,429 240,441" fill="#ff8c00"/>
  <polygon points="320,435 310,429 310,441" fill="#ff8c00"/>
  <text x="245" y="463" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ff8c00">spacing</text>

  <text x="80" y="515" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#666">
    Along the same scanline: higher density generally means smaller spacing.
  </text>
</svg>
