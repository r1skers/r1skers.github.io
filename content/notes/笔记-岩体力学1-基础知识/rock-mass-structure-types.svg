<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <rect width="980" height="620" fill="#f7f7f7"/>
  <text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#222">Rock-Mass Structure Types (schematic)</text>

  <!-- Panel backgrounds -->
  <rect x="40" y="90" width="430" height="230" fill="#fff" stroke="#cfcfcf"/>
  <rect x="510" y="90" width="430" height="230" fill="#fff" stroke="#cfcfcf"/>
  <rect x="40" y="350" width="430" height="230" fill="#fff" stroke="#cfcfcf"/>
  <rect x="510" y="350" width="430" height="230" fill="#fff" stroke="#cfcfcf"/>

  <!-- Massive blocky -->
  <text x="58" y="122" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">Massive-blocky</text>
  <rect x="90" y="150" width="130" height="120" fill="none" stroke="#0d6efd" stroke-width="3"/>
  <rect x="230" y="165" width="170" height="95" fill="none" stroke="#0d6efd" stroke-width="3"/>
  <text x="58" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666">Fewer dominant discontinuities</text>

  <!-- Layered -->
  <text x="528" y="122" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">Layered</text>
  <line x1="545" y1="165" x2="915" y2="145" stroke="#198754" stroke-width="3"/>
  <line x1="545" y1="190" x2="915" y2="170" stroke="#198754" stroke-width="3"/>
  <line x1="545" y1="215" x2="915" y2="195" stroke="#198754" stroke-width="3"/>
  <line x1="545" y1="240" x2="915" y2="220" stroke="#198754" stroke-width="3"/>
  <line x1="545" y1="265" x2="915" y2="245" stroke="#198754" stroke-width="3"/>
  <text x="528" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666">Strong anisotropy along bedding</text>

  <!-- Fractured -->
  <text x="58" y="382" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">Fractured</text>
  <line x1="70" y1="420" x2="430" y2="530" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="90" y1="540" x2="400" y2="400" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="120" y1="400" x2="320" y2="560" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="260" y1="390" x2="460" y2="520" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="55" y1="500" x2="220" y2="360" stroke="#dc3545" stroke-width="2.5"/>
  <line x1="280" y1="560" x2="430" y2="420" stroke="#dc3545" stroke-width="2.5"/>
  <text x="58" y="562" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666">Dense intersecting joints</text>

  <!-- Disintegrated / granular -->
  <text x="528" y="382" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#111">Disintegrated (granular)</text>
  <circle cx="585" cy="455" r="16" fill="#ff8c00"/>
  <circle cx="635" cy="470" r="13" fill="#ff8c00"/>
  <circle cx="695" cy="445" r="15" fill="#ff8c00"/>
  <circle cx="748" cy="470" r="12" fill="#ff8c00"/>
  <circle cx="812" cy="450" r="17" fill="#ff8c00"/>
  <circle cx="870" cy="472" r="14" fill="#ff8c00"/>
  <circle cx="605" cy="520" r="12" fill="#ff8c00"/>
  <circle cx="660" cy="525" r="16" fill="#ff8c00"/>
  <circle cx="720" cy="520" r="11" fill="#ff8c00"/>
  <circle cx="780" cy="525" r="15" fill="#ff8c00"/>
  <circle cx="840" cy="520" r="12" fill="#ff8c00"/>
  <text x="528" y="562" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666">Poor integrity, block network collapsed</text>
</svg>
