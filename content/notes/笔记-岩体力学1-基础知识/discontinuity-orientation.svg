<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f7f7f7"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#222">Discontinuity Orientation (schematic)</text>

  <!-- Ground line -->
  <line x1="80" y1="430" x2="880" y2="430" stroke="#333" stroke-width="3"/>
  <text x="785" y="455" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333">Horizontal</text>

  <!-- Plane trace -->
  <line x1="230" y1="430" x2="610" y2="250" stroke="#0d6efd" stroke-width="6"/>
  <text x="622" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0d6efd">Plane trace</text>

  <!-- Dip direction arrow -->
  <line x1="500" y1="315" x2="610" y2="365" stroke="#d63384" stroke-width="5"/>
  <polygon points="610,365 590,360 600,345" fill="#d63384"/>
  <text x="625" y="372" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d63384">Dip direction</text>

  <!-- Strike arrow -->
  <line x1="250" y1="210" x2="560" y2="210" stroke="#198754" stroke-width="5"/>
  <polygon points="560,210 542,200 542,220" fill="#198754"/>
  <text x="575" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#198754">Strike</text>

  <!-- Dip angle arc -->
  <path d="M 230 430 A 120 120 0 0 1 330 355" fill="none" stroke="#ff8c00" stroke-width="5"/>
  <text x="268" y="382" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ff8c00">Dip angle θ</text>

  <!-- normal -->
  <line x1="420" y1="340" x2="360" y2="220" stroke="#6c757d" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="300" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6c757d">Plane normal</text>

  <text x="40" y="520" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#666">
    Not to scale. Used for field-record terms only.
  </text>
</svg>
